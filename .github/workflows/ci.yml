name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint (stylelint)
        run: npm run lint:style

      - name: Type Check（强制门禁）
        # 类型错误已收敛为 0（含存量 views/system|monitor|tool），任何新增错误都会阻断 CI
        run: npm run type-check

      - name: Build
        run: npm run build:prod
